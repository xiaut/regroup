[package]
name = "regroup"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Find machines by SSH host key fingerprint and update ~/.ssh/config"
homepage = "https://github.com/yourusername/regroup"

[dependencies]
serde_json = "1.0.154"
ed25519-dalek = "2.2.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = "1.8.0"
base64 = { version = "0.21.7", features = ["std"] }
